<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title desc"><title id="title">3×3配对矩阵</title><desc id="desc">V1与R1、V2与R2、V3与R3为配对，其余为非配对。非配对不表示病理一定不同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#243246"><text x="500" y="42" font-size="24" text-anchor="middle">CT与报告的配对矩阵</text><text x="380" y="95" font-size="20" text-anchor="middle">报告 R1</text><text x="550" y="95" font-size="20" text-anchor="middle">报告 R2</text><text x="720" y="95" font-size="20" text-anchor="middle">报告 R3</text><text x="190" y="155" font-size="20" text-anchor="middle">CT V1</text><rect x="310" y="120" width="142" height="57" rx="8" fill="#dceee7" stroke="#72a48e"/><text x="381.0" y="155.5" font-size="20" text-anchor="middle">配对</text><rect x="480" y="120" width="142" height="57" rx="8" fill="#eef0f5" stroke="#ccd3df"/><text x="551.0" y="155.5" font-size="20" text-anchor="middle">非配对</text><rect x="650" y="120" width="142" height="57" rx="8" fill="#eef0f5" stroke="#ccd3df"/><text x="721.0" y="155.5" font-size="20" text-anchor="middle">非配对</text><text x="190" y="229" font-size="20" text-anchor="middle">CT V2</text><rect x="310" y="194" width="142" height="57" rx="8" fill="#eef0f5" stroke="#ccd3df"/><text x="381.0" y="229.5" font-size="20" text-anchor="middle">非配对</text><rect x="480" y="194" width="142" height="57" rx="8" fill="#dceee7" stroke="#72a48e"/><text x="551.0" y="229.5" font-size="20" text-anchor="middle">配对</text><rect x="650" y="194" width="142" height="57" rx="8" fill="#eef0f5" stroke="#ccd3df"/><text x="721.0" y="229.5" font-size="20" text-anchor="middle">非配对</text><text x="190" y="303" font-size="20" text-anchor="middle">CT V3</text><rect x="310" y="268" width="142" height="57" rx="8" fill="#eef0f5" stroke="#ccd3df"/><text x="381.0" y="303.5" font-size="20" text-anchor="middle">非配对</text><rect x="480" y="268" width="142" height="57" rx="8" fill="#eef0f5" stroke="#ccd3df"/><text x="551.0" y="303.5" font-size="20" text-anchor="middle">非配对</text><rect x="650" y="268" width="142" height="57" rx="8" fill="#dceee7" stroke="#72a48e"/><text x="721.0" y="303.5" font-size="20" text-anchor="middle">配对</text><text x="500" y="380" font-size="18" text-anchor="middle">提高对角配对的相似度，降低batch内非配对组合的相似度</text></g></svg>