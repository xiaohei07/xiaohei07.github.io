<svg xmlns="http://www.w3.org/2000/svg" width="850" height="551" viewBox="0 0 850 551" role="img" aria-label="区域信息怎样参与报告生成"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="850" height="551" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei,sans-serif" fill="#243246"><text x="425" y="42" text-anchor="middle" font-size="24">区域信息怎样参与报告生成</text><rect x="100" y="72" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="104" font-size="22" text-anchor="middle">CT与区域mask</text><text x="425" y="132" font-size="17" text-anchor="middle">全局上下文 + 每个解剖区域</text><path d="M425 154V186" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="186" width="650" height="82" rx="9" fill="#e8e5f2" stroke="#9cacc1"/><text x="425" y="218" font-size="22" text-anchor="middle">解耦局部表示</text><text x="425" y="246" font-size="17" text-anchor="middle">裁剪CT保纹理；未裁剪mask保几何</text><path d="M425 268V300" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="300" width="650" height="82" rx="9" fill="#e7f1ea" stroke="#9cacc1"/><text x="425" y="332" font-size="22" text-anchor="middle">组合全局与区域特征</text><text x="425" y="360" font-size="17" text-anchor="middle">区域特征打乱顺序，替换提示占位符</text><path d="M425 382V414" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="414" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="446" font-size="22" text-anchor="middle">预测区域名称，再生成区域报告</text><text x="425" y="474" font-size="17" text-anchor="middle">RRA使用自回归文本监督</text></g></svg>