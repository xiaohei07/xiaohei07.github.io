<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">CT-CHAT训练状态</title><desc id="desc">两阶段都冻结视觉编码器。第一阶段冻结LLM训练投影器，第二阶段更新投影器和LLM的LoRA。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#243246"><text x="500" y="44" font-size="24" text-anchor="middle">CT-CHAT的两个训练阶段</text><text x="100" y="134" font-size="21" text-anchor="middle">概念对齐</text><text x="100" y="264" font-size="21" text-anchor="middle">指令微调</text><rect x="220" y="88" width="215" height="90" rx="8" fill="#e9edf2" stroke="#b5bfce"/><text x="327.5" y="126.5" font-size="20" text-anchor="middle">视觉编码器</text><text x="327.5" y="153.5" font-size="16" text-anchor="middle">冻结</text><rect x="485" y="88" width="215" height="90" rx="8" fill="#deeee6" stroke="#84ac97"/><text x="592.5" y="126.5" font-size="20" text-anchor="middle">投影器</text><text x="592.5" y="153.5" font-size="16" text-anchor="middle">更新</text><rect x="750" y="88" width="215" height="90" rx="8" fill="#e9edf2" stroke="#b5bfce"/><text x="857.5" y="126.5" font-size="20" text-anchor="middle">LLM</text><text x="857.5" y="153.5" font-size="16" text-anchor="middle">冻结</text><polyline points="435,133 485,133" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="700,133 750,133" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="220" y="218" width="215" height="90" rx="8" fill="#e9edf2" stroke="#b5bfce"/><text x="327.5" y="256.5" font-size="20" text-anchor="middle">视觉编码器</text><text x="327.5" y="283.5" font-size="16" text-anchor="middle">冻结</text><rect x="485" y="218" width="215" height="90" rx="8" fill="#deeee6" stroke="#84ac97"/><text x="592.5" y="256.5" font-size="20" text-anchor="middle">投影器</text><text x="592.5" y="283.5" font-size="16" text-anchor="middle">更新</text><rect x="750" y="218" width="215" height="90" rx="8" fill="#eae3f3" stroke="#b09bca"/><text x="857.5" y="256.5" font-size="20" text-anchor="middle">LLM</text><text x="857.5" y="283.5" font-size="16" text-anchor="middle">更新LoRA参数</text><polyline points="435,263 485,263" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="700,263 750,263" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600" y="354" font-size="17" text-anchor="middle">前一阶段学习医学图文关系，后一阶段学习按指令生成不同形式的回答</text></g></svg>