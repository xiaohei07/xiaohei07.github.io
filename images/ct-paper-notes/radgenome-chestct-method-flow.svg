<svg xmlns="http://www.w3.org/2000/svg" width="850" height="551" viewBox="0 0 850 551" role="img" aria-label="区域问答的监督从哪里来"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="850" height="551" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei,sans-serif" fill="#243246"><text x="425" y="42" text-anchor="middle" font-size="24">区域问答的监督从哪里来</text><rect x="100" y="72" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="104" font-size="22" text-anchor="middle">CT-RATE的体积与报告</text><text x="425" y="132" font-size="17" text-anchor="middle">SAT生成197类解剖mask</text><path d="M425 154V186" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="186" width="650" height="82" rx="9" fill="#e8e5f2" stroke="#9cacc1"/><text x="425" y="218" font-size="22" text-anchor="middle">Findings句子对应解剖区域</text><text x="425" y="246" font-size="17" text-anchor="middle">GPT-4标注子集 → GPT-2规模化预测</text><path d="M425 268V300" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="300" width="650" height="82" rx="9" fill="#e7f1ea" stroke="#9cacc1"/><text x="425" y="332" font-size="22" text-anchor="middle">实体抽取与正常／异常关系</text><text x="425" y="360" font-size="17" text-anchor="middle">NER + GPT-4核查；保留否定与层级</text><path d="M425 382V414" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="414" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="446" font-size="22" text-anchor="middle">规则形成区域问题，Impression形成病例问题</text><text x="425" y="474" font-size="17" text-anchor="middle">Abnormality / Presence / Location / Size / Disorder</text></g></svg>