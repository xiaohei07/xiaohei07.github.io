<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">CT-RATE研究路线</title><desc id="desc">CT-RATE训练CT-CLIP，后者用于检测和检索，并通过其视觉编码器构建CT-CHAT。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#243246"><rect x="30" y="105" width="230" height="100" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="145.0" y="148.5" font-size="20" text-anchor="middle">CT-RATE</text><text x="145.0" y="175.5" font-size="16" text-anchor="middle">CT体积 + 放射科报告</text><rect x="355" y="105" width="250" height="100" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="480.0" y="148.5" font-size="20" text-anchor="middle">CT-CLIP</text><text x="480.0" y="175.5" font-size="16" text-anchor="middle">视觉与文本编码器</text><rect x="710" y="105" width="260" height="100" rx="8" fill="#e8e5f2" stroke="#b1a1cc"/><text x="840.0" y="148.5" font-size="20" text-anchor="middle">CT-CHAT</text><text x="840.0" y="175.5" font-size="16" text-anchor="middle">视觉编码器 + 投影器 + LLM</text><polyline points="260,155 355,155" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="306" y="138" font-size="15" text-anchor="middle">对比预训练</text><polyline points="605,155 710,155" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="658" y="128" font-size="15" text-anchor="middle">视觉编码器</text><text x="658" y="150" font-size="15" text-anchor="middle">接入LLM</text><rect x="320" y="285" width="180" height="70" rx="8" fill="#e7f1ea" stroke="#90aab8"/><text x="410.0" y="327.0" font-size="20" text-anchor="middle">异常检测</text><rect x="535" y="285" width="180" height="70" rx="8" fill="#e7f1ea" stroke="#90aab8"/><text x="625.0" y="327.0" font-size="20" text-anchor="middle">病例检索</text><polyline points="480,205 480,245 410,245 410,285" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="480,245 625,245 625,285" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="755" y="285" width="210" height="70" rx="8" fill="#eee9f6" stroke="#90aab8"/><text x="860.0" y="327.0" font-size="20" text-anchor="middle">问答 / 报告生成</text><polyline points="840,205 840,285" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="505" y="47" font-size="23" text-anchor="middle">从配对数据，到可复用表征，再到下游任务</text></g></svg>