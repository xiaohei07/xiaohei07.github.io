<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img" aria-labelledby="title desc"><title id="title">CT视觉表征与结节属性共同生成报告</title><desc id="desc">同一CT分成视觉编码与结节分割两条路径；视觉tokens和结构化文本字段与报告生成指令一起输入LLM，输出报告。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#243246"><text x="500" y="44" font-size="24" text-anchor="middle">结节信息怎样参与报告生成</text><rect x="40" y="228" width="145" height="90" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="112.5" y="280.0" font-size="20" text-anchor="middle">同一CT体积</text><rect x="265" y="98" width="215" height="90" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="372.5" y="136.5" font-size="20" text-anchor="middle">视觉编码器</text><text x="372.5" y="163.5" font-size="16" text-anchor="middle">CT-CLIP（冻结）</text><rect x="550" y="98" width="215" height="90" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="657.5" y="150.0" font-size="20" text-anchor="middle">视觉tokens</text><rect x="265" y="358" width="215" height="90" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="372.5" y="396.5" font-size="20" text-anchor="middle">结节分割</text><text x="372.5" y="423.5" font-size="16" text-anchor="middle">TotalSegmentator</text><rect x="550" y="343" width="310" height="120" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="705.0" y="383.0" font-size="20" text-anchor="middle">结构化文本字段</text><text x="705.0" y="410.0" font-size="16" text-anchor="middle">肺叶位置 / 质心</text><text x="705.0" y="437.0" font-size="16" text-anchor="middle">三个方向的直径 / 体积</text><polyline points="185,273 220,273 220,143 265,143" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="220,273 220,403 265,403" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="480,143 550,143" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="480,403 550,403" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="685" y="230" width="215" height="86" rx="8" fill="#eee9f6" stroke="#b1a1cc"/><text x="792.5" y="266.5" font-size="20" text-anchor="middle">多模态输入</text><text x="792.5" y="293.5" font-size="16" text-anchor="middle">tokens + 字段 + 指令</text><rect x="345" y="242" width="235" height="62" rx="8" fill="#eee9f6" stroke="#b1a1cc"/><text x="462.5" y="280.0" font-size="20" text-anchor="middle">报告生成指令</text><polyline points="765,143 792,143 792,230" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="705,343 705,330 792,330 792,316" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="580,273 685,273" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="550" y="518" width="215" height="78" rx="8" fill="#eee9f6" stroke="#b1a1cc"/><text x="657.5" y="564.0" font-size="20" text-anchor="middle">LLM</text><rect x="260" y="518" width="215" height="78" rx="8" fill="#deeee6" stroke="#84ac97"/><text x="367.5" y="564.0" font-size="20" text-anchor="middle">生成报告</text><polyline points="900,273 937,273 937,557 765,557" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="550,557 475,557" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g></svg>