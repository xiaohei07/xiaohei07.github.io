<svg xmlns="http://www.w3.org/2000/svg" width="850" height="551" viewBox="0 0 850 551" role="img" aria-label="DCP-PD：同一提示接口，两种标签来源"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="850" height="551" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei,sans-serif" fill="#243246"><text x="425" y="42" text-anchor="middle" font-size="24">DCP-PD：同一提示接口，两种标签来源</text><rect x="100" y="72" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="104" font-size="22" text-anchor="middle">训练：从报告抽取GT标签</text><text x="425" y="132" font-size="17" text-anchor="middle">异常存在性 → 左右侧 → 肺叶</text><path d="M425 154V186" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="186" width="650" height="82" rx="9" fill="#e8e5f2" stroke="#9cacc1"/><text x="425" y="218" font-size="22" text-anchor="middle">随机丢弃提示实体</text><text x="425" y="246" font-size="17" text-anchor="middle">主实验概率0.3，再填入自然语言模板</text><path d="M425 268V300" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="300" width="650" height="82" rx="9" fill="#e7f1ea" stroke="#9cacc1"/><text x="425" y="332" font-size="22" text-anchor="middle">视觉token＋提示＋指令</text><text x="425" y="360" font-size="17" text-anchor="middle">训练投影器与语言模型LoRA</text><path d="M425 382V414" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="414" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="446" font-size="22" text-anchor="middle">推理：由分类器提供标签</text><text x="425" y="474" font-size="17" text-anchor="middle">以同一模板替换训练时的GT来源</text></g></svg>