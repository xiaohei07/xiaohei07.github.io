<svg xmlns="http://www.w3.org/2000/svg" width="850" height="551" viewBox="0 0 850 551" role="img" aria-label="Patch-Aligned训练：局部监督加入在哪里"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="850" height="551" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei,sans-serif" fill="#243246"><text x="425" y="42" text-anchor="middle" font-size="24">Patch-Aligned训练：局部监督加入在哪里</text><rect x="100" y="72" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="104" font-size="22" text-anchor="middle">LLaVA图文预训练数据</text><text x="425" y="132" font-size="17" text-anchor="middle">RAM标签 → Grounding DINO框 → SAM mask</text><path d="M425 154V186" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="186" width="650" height="82" rx="9" fill="#e8e5f2" stroke="#9cacc1"/><text x="425" y="218" font-size="22" text-anchor="middle">mask选择对应视觉patch</text><text x="425" y="246" font-size="17" text-anchor="middle">平均局部视觉向量与标签子token嵌入</text><path d="M425 268V300" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="300" width="650" height="82" rx="9" fill="#e7f1ea" stroke="#9cacc1"/><text x="425" y="332" font-size="22" text-anchor="middle">第一阶段训练projector</text><text x="425" y="360" font-size="17" text-anchor="middle">caption损失＋β×patch对齐损失</text><path d="M425 382V414" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="414" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="446" font-size="22" text-anchor="middle">相同SFT设置下比较</text><text x="425" y="474" font-size="17" text-anchor="middle">检查定位、问答和通用指令表现</text></g></svg>