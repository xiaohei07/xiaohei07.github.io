<svg xmlns="http://www.w3.org/2000/svg" width="850" height="551" viewBox="0 0 850 551" role="img" aria-label="Argus的配置选择与训练顺序"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="850" height="551" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei,sans-serif" fill="#243246"><text x="425" y="42" text-anchor="middle" font-size="24">Argus的配置选择与训练顺序</text><rect x="100" y="72" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="104" font-size="22" text-anchor="middle">视觉编码器预训练</text><text x="425" y="132" font-size="17" text-anchor="middle">3D-MAE学习体积结构，再用FLIP对齐文本</text><path d="M425 154V186" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="186" width="650" height="82" rx="9" fill="#e8e5f2" stroke="#9cacc1"/><text x="425" y="218" font-size="22" text-anchor="middle">压缩视觉序列</text><text x="425" y="246" font-size="17" text-anchor="middle">空间信息重排到通道，再接两层MLP</text><path d="M425 268V300" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="300" width="650" height="82" rx="9" fill="#e7f1ea" stroke="#9cacc1"/><text x="425" y="332" font-size="22" text-anchor="middle">先训练连接器，再联合微调</text><text x="425" y="360" font-size="17" text-anchor="middle">后续解冻ViT；指令包含正常与异常描述</text><path d="M425 382V414" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="414" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="446" font-size="22" text-anchor="middle">在相同来源下比较规模与分辨率</text><text x="425" y="474" font-size="17" text-anchor="middle">3B／8B／70B；分别报告三个测试集</text></g></svg>