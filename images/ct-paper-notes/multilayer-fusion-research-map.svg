<svg xmlns="http://www.w3.org/2000/svg" width="920" height="510" viewBox="0 0 920 510" role="img" aria-label="视觉信息来源、访问位置、计算预算三个设计维度"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#66758b"/></marker></defs><rect width="920" height="510" rx="16" fill="#f4f6fb"/><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#26384b"><text x="460" y="45" font-size="24">三个问题需要分别控制</text><rect x="60" y="78" width="800" height="100" rx="12" fill="#e1edf0" stroke="#9aaec1"/><text x="460" y="113" font-size="23">信息从哪里来？</text><text x="460" y="148" font-size="18">浅／中／深层 · 高分辨率分块 · 器官或区域表示</text><path d="M460 178V207" stroke="#66758b" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="214" width="800" height="100" rx="12" fill="#e9e6f2" stroke="#9aaec1"/><text x="460" y="249" font-size="23">语言模型在哪里访问？</text><text x="460" y="284" font-size="18">输入前汇总 · 中间层残差注入 · 稀疏cross-attention访问</text><path d="M460 314V343" stroke="#66758b" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="350" width="800" height="100" rx="12" fill="#e4efe6" stroke="#9aaec1"/><text x="460" y="385" font-size="23">访问后保留多少计算？</text><text x="460" y="420" font-size="18">全部保留 · 剪枝 · 外部记忆 · 分组沿深度注入</text><text x="460" y="482" font-size="16">同一实验只改变一个主要因素，才能解释收益来自哪里</text></g></svg>