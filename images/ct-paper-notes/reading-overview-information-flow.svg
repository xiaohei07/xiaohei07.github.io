<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="472" viewBox="0 0 1040 472" role="img" aria-labelledby="title desc">
<title id="title">CT报告生成的常见信息路径</title><desc id="desc">实线从CT影像依次连接视觉编码器、视觉连接器、LLM和报告；区域mask、报告监督和检索参考按方法选择加入，以虚线表示。不是具体研究方案。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#536475"/></marker><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#223345}.heading{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.sub{font-size:16px}.note{font-size:15px;fill:#526478}.main{fill:#eef4fa;stroke:#6d8aa7;stroke-width:1.5}.aux{fill:#f4f5ed;stroke:#99a581;stroke-width:1.5}.line{stroke:#536475;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style></defs>
<rect width="1040" height="472" rx="16" fill="#fff"/>
<text class="heading" x="32" y="42">CT报告生成：沿信息路径阅读不同论文</text>
<text class="note" x="32" y="70">实线为常见生成路径；虚线条件按具体方法使用，并非每篇论文都包含全部模块。</text>
<g><rect class="main" x="32" y="170" width="155" height="92" rx="12"/><text class="label" x="109" y="207" text-anchor="middle">CT影像</text><text class="sub" x="109" y="237" text-anchor="middle">体积与空间信息</text>
<rect class="main" x="232" y="170" width="155" height="92" rx="12"/><text class="label" x="309" y="207" text-anchor="middle">视觉编码器</text><text class="sub" x="309" y="237" text-anchor="middle">提取视觉特征</text>
<rect class="main" x="432" y="170" width="155" height="92" rx="12"/><text class="label" x="509" y="207" text-anchor="middle">视觉连接器</text><text class="sub" x="509" y="237" text-anchor="middle">组织与对齐表示</text>
<rect class="main" x="632" y="170" width="155" height="92" rx="12"/><text class="label" x="709" y="207" text-anchor="middle">LLM</text><text class="sub" x="709" y="237" text-anchor="middle">生成文本序列</text>
<rect class="main" x="832" y="170" width="176" height="92" rx="12"/><text class="label" x="920" y="207" text-anchor="middle">生成报告</text><text class="sub" x="920" y="237" text-anchor="middle">再核对临床事实</text></g>
<path class="line" d="M187 216H226"/><path class="line" d="M387 216H426"/><path class="line" d="M587 216H626"/><path class="line" d="M787 216H826"/>
<rect class="aux" x="232" y="324" width="355" height="81" rx="12"/><text class="label" x="409" y="355" text-anchor="middle">区域mask</text><text class="sub" x="409" y="383" text-anchor="middle">选择区域、汇聚特征或计算属性</text>
<path class="line dash" d="M309 324V269"/><path class="line dash" d="M509 324V269"/>
<rect class="aux" x="632" y="324" width="176" height="81" rx="12"/><text class="label" x="720" y="355" text-anchor="middle">检索与提示</text><text class="sub" x="720" y="383" text-anchor="middle">按方法补充条件</text><path class="line dash" d="M709 324V269"/>
<rect class="aux" x="232" y="96" width="555" height="49" rx="10"/><text class="sub" x="509" y="127" text-anchor="middle">配对报告／区域文本／异常标签：用于不同训练目标</text><path class="line dash" d="M309 145V164"/><path class="line dash" d="M509 145V164"/><path class="line dash" d="M709 145V164"/>
<text class="note" x="32" y="449">阅读示意 · 不表示某篇论文的完整结构，也不代表本人的实验方案</text>
</svg>
