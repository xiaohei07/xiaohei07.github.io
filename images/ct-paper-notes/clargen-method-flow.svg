<svg xmlns="http://www.w3.org/2000/svg" width="850" height="551" viewBox="0 0 850 551" role="img" aria-label="CLarGen：临床信息如何进入报告"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="850" height="551" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei,sans-serif" fill="#243246"><text x="425" y="42" text-anchor="middle" font-size="24">CLarGen：临床信息如何进入报告</text><rect x="100" y="72" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="104" font-size="22" text-anchor="middle">3D CT → 冻结视觉编码器</text><text x="425" y="132" font-size="17" text-anchor="middle">保留视觉token供分类和检索使用</text><path d="M425 154V186" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="186" width="650" height="82" rx="9" fill="#e8e5f2" stroke="#9cacc1"/><text x="425" y="218" font-size="22" text-anchor="middle">异常识别与图文投影</text><text x="425" y="246" font-size="17" text-anchor="middle">18类查询预测概率；投影器学习检索表示</text><path d="M425 268V300" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="300" width="650" height="82" rx="9" fill="#e7f1ea" stroke="#9cacc1"/><text x="425" y="332" font-size="22" text-anchor="middle">病理引导并兼顾异常覆盖的检索</text><text x="425" y="360" font-size="17" text-anchor="middle">只检索训练集，排除同患者报告</text><path d="M425 382V414" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="414" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="446" font-size="22" text-anchor="middle">标签＋范例＋可用患者信息</text><text x="425" y="474" font-size="17" text-anchor="middle">冻结MedGemma-27B合成Findings与Impression</text></g></svg>