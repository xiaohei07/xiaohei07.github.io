<svg xmlns="http://www.w3.org/2000/svg" width="850" height="551" viewBox="0 0 850 551" role="img" aria-label="Merlin报告生成需要额外适配"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="850" height="551" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei,sans-serif" fill="#243246"><text x="425" y="42" text-anchor="middle" font-size="24">Merlin报告生成需要额外适配</text><rect x="100" y="72" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="104" font-size="22" text-anchor="middle">预训练CT编码器</text><text x="425" y="132" font-size="17" text-anchor="middle">I3D ResNet152，报告与诊断码提供监督</text><path d="M425 154V186" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="186" width="650" height="82" rx="9" fill="#e8e5f2" stroke="#9cacc1"/><text x="425" y="218" font-size="22" text-anchor="middle">取最后一层空间特征</text><text x="425" y="246" font-size="17" text-anchor="middle">7×7×10个位置，每个位置2048维</text><path d="M425 268V300" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="300" width="650" height="82" rx="9" fill="#e7f1ea" stroke="#9cacc1"/><text x="425" y="332" font-size="22" text-anchor="middle">线性adapter连接RadLlama-7B</text><text x="425" y="360" font-size="17" text-anchor="middle">映射到4096维，训练adapter与LoRA</text><path d="M425 382V414" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="414" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="446" font-size="22" text-anchor="middle">指定器官系统逐段生成</text><text x="425" y="474" font-size="17" text-anchor="middle">组合Findings，并按内容检查漏报与误报</text></g></svg>