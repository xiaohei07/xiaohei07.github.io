<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="205" viewBox="0 0 1000 205" role="img" aria-labelledby="title desc"><title id="title">CT体积预处理</title><desc id="desc">统一空间间距、中心裁剪或填充、转换HU并截断、归一化。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#243246"><rect x="20" y="40" width="210" height="130" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="125.0" y="85.0" font-size="20" text-anchor="middle">空间间距</text><text x="125.0" y="112.0" font-size="16" text-anchor="middle">x / y：0.75mm</text><text x="125.0" y="139.0" font-size="16" text-anchor="middle">z：1.5mm</text><rect x="270" y="40" width="210" height="130" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="375.0" y="98.5" font-size="20" text-anchor="middle">中心裁剪 / 填充</text><text x="375.0" y="125.5" font-size="16" text-anchor="middle">480 × 480 × 240</text><rect x="520" y="40" width="210" height="130" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="625.0" y="85.0" font-size="20" text-anchor="middle">转换并截断HU</text><text x="625.0" y="112.0" font-size="16" text-anchor="middle">slope / intercept</text><text x="625.0" y="139.0" font-size="16" text-anchor="middle">[-1000, 1000]</text><rect x="770" y="40" width="210" height="130" rx="8" fill="#e3edf1" stroke="#90aab8"/><text x="875.0" y="98.5" font-size="20" text-anchor="middle">训练时归一化</text><text x="875.0" y="125.5" font-size="16" text-anchor="middle">[-1, 1]</text><polyline points="230,105 270,105" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="480,105 520,105" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polyline points="730,105 770,105" stroke="#657188" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g></svg>