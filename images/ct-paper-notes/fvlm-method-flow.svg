<svg xmlns="http://www.w3.org/2000/svg" width="850" height="551" viewBox="0 0 850 551" role="img" aria-label="fVLM的监督关系如何变化"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#657188"/></marker></defs><rect width="850" height="551" rx="12" fill="#f4f6fb"/><g font-family="Microsoft YaHei,sans-serif" fill="#243246"><text x="425" y="42" text-anchor="middle" font-size="24">fVLM的监督关系如何变化</text><rect x="100" y="72" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="104" font-size="22" text-anchor="middle">按解剖区域配对</text><text x="425" y="132" font-size="17" text-anchor="middle">影像mask选token，报告按器官提取</text><path d="M425 154V186" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="186" width="650" height="82" rx="9" fill="#e8e5f2" stroke="#9cacc1"/><text x="425" y="218" font-size="22" text-anchor="middle">建立跨患者相似度矩阵</text><text x="425" y="246" font-size="17" text-anchor="middle">初始配对在对角线，双向对比学习</text><path d="M425 268V300" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="300" width="650" height="82" rx="9" fill="#e7f1ea" stroke="#9cacc1"/><text x="425" y="332" font-size="22" text-anchor="middle">修正正常器官的非对角标签</text><text x="425" y="360" font-size="17" text-anchor="middle">依据报告规则添加同类正关系</text><path d="M425 382V414" stroke="#657188" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="414" width="650" height="82" rx="9" fill="#e3edf1" stroke="#9cacc1"/><text x="425" y="446" font-size="22" text-anchor="middle">加入另一模型估计的软目标</text><text x="425" y="474" font-size="17" text-anchor="middle">交替训练，保留相近异常的可能关系</text></g></svg>