<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 425" role="img" aria-labelledby="title desc"><title id="title">正文从源文件到可访问的 HTML</title><desc id="desc">身份、公开范围和安全清理分别负责不同问题。。内容建模与展示入口分开；空主题入口不能计为已完成研究。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="425" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">正文从源文件到可访问的 HTML</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">身份、公开范围和安全清理分别负责不同问题。</text><rect x="30" y="130" width="230" height="140" rx="9" fill="#e4f5f1" stroke="#087f79" stroke-width="1.5"/><text x="48" y="162" font-size="23" fill="#087f79" font-weight="650" text-anchor="start">来源与清单</text><text x="48" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">稳定内容 ID</text><text x="48" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">公开版本 / 哈希</text><text x="48" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">保留旧链接映射</text><rect x="300" y="130" width="230" height="140" rx="9" fill="#e4f5f1" stroke="#087f79" stroke-width="1.5"/><text x="318" y="162" font-size="23" fill="#087f79" font-weight="650" text-anchor="start">Markdown 解析</text><text x="318" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">GFM / 中日韩兼容</text><text x="318" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">历史内容处理</text><text x="318" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">转换到 HTML 树</text><rect x="570" y="130" width="230" height="140" rx="9" fill="#fff1dc" stroke="#a75c08" stroke-width="1.5"/><text x="588" y="162" font-size="23" fill="#a75c08" font-weight="650" text-anchor="start">HTML 安全与装饰</text><text x="588" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">raw → sanitize</text><text x="588" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">slug / highlight</text><text x="588" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">目录、图片和代码样式</text><rect x="840" y="130" width="230" height="140" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="858" y="162" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">页面与索引</text><text x="858" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">文章 HTML</text><text x="858" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">卡片 / 搜索 / 归档</text><text x="858" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">同一内容多个入口</text><polyline points="260,200 300,200" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="530,200 570,200" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,200 840,200" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="345" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">哈希证明版本一致，不证明内容正确或素材获准公开。sanitize 必须在不可信 raw 展开之后。</text></g></svg>