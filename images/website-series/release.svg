<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">发布切换与数据库迁移是两条线</title><desc id="desc">现状：静态 20261018-2；API/Compose 20261018-1。。回滚代码需要数据库仍兼容；历史演练不等于持续备份已经建立。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="500" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">发布切换与数据库迁移是两条线</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">现状：静态 20261018-2；API/Compose 20261018-1。</text><rect x="30" y="135" width="280" height="120" rx="9" fill="#e4f5f1" stroke="#087f79" stroke-width="1.5"/><text x="48" y="167" font-size="23" fill="#087f79" font-weight="650" text-anchor="start">不可变版本目录</text><text x="48" y="199" font-size="17.110799438990192" fill="#172b45" font-weight="400" text-anchor="start">releases/20261018-1/web</text><text x="48" y="224" font-size="17.110799438990192" fill="#172b45" font-weight="400" text-anchor="start">releases/20261018-2/web</text><rect x="410" y="135" width="280" height="120" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="428" y="167" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">current 指向新版本</text><text x="428" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">先上传、检查，再切换</text><text x="428" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">HTML 指向新哈希资源</text><rect x="790" y="135" width="280" height="120" rx="9" fill="#fff1dc" stroke="#a75c08" stroke-width="1.5"/><text x="808" y="167" font-size="23" fill="#a75c08" font-weight="650" text-anchor="start">打开中的旧页面</text><text x="808" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">还可能请求旧 chunk</text><text x="808" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">已保留 3 个特定旧资源</text><polyline points="310,195 410,195" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="690,195 790,195" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="338" width="280" height="110" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="48" y="370" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">数据库结构与数据</text><text x="48" y="402" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">不随目录指针自动回退</text><rect x="410" y="338" width="280" height="110" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="428" y="370" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">兼容迁移（拟议原则）</text><text x="428" y="402" font-size="14.969325153374239" fill="#172b45" font-weight="400" text-anchor="start">expand → migrate → contract</text><rect x="790" y="338" width="280" height="110" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="808" y="370" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">备份与恢复演练</text><text x="808" y="402" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">已有一次恢复核对记录</text><text x="808" y="427" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">自动 / 异地备份尚未配置</text><polyline points="310,391 410,391" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="690,391 790,391" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/></g></svg>