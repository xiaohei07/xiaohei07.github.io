<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">横幅的可见状态与内部状态</title><desc id="desc">旧图保留到新图准备好；失败有明确退路。。图示为存在旧图的切换情况；首次加载没有旧图时仍需处理失败。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="500" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">横幅的可见状态与内部状态</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">旧图保留到新图准备好；失败有明确退路。</text><rect x="30" y="135" width="240" height="110" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="48" y="167" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">A 稳定显示</text><text x="48" y="199" font-size="13.691275167785243" fill="#172b45" font-weight="400" text-anchor="start">current=A / previous=null</text><text x="48" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">ready=true</text><rect x="425" y="135" width="250" height="110" rx="9" fill="#fff1dc" stroke="#a75c08" stroke-width="1.5"/><text x="443" y="167" font-size="23" fill="#a75c08" font-weight="650" text-anchor="start">请求切换到 B</text><text x="443" y="199" font-size="16.411042944785283" fill="#172b45" font-weight="400" text-anchor="start">current=B / previous=A</text><text x="443" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">ready=false</text><rect x="830" y="135" width="240" height="110" rx="9" fill="#e4f5f1" stroke="#087f79" stroke-width="1.5"/><text x="848" y="167" font-size="23" fill="#087f79" font-weight="650" text-anchor="start">B 加载成功</text><text x="848" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">ready=true</text><text x="848" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">过渡结束后移除 A</text><rect x="425" y="332" width="250" height="110" rx="9" fill="#ffecef" stroke="#ac3146" stroke-width="1.5"/><text x="443" y="364" font-size="23" fill="#ac3146" font-weight="650" text-anchor="start">B 加载失败</text><text x="443" y="396" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">current 回到 A</text><text x="443" y="421" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">不露出空白占位</text><polyline points="270,185 425,185" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="168" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">change(B)</text><polyline points="675,185 830,185" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="722" y="168" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">onLoad</text><polyline points="550,245 550,332" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="565" y="286" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">onError</text><polyline points="425,387 145,387 145,245" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="246" y="370" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">恢复</text></g></svg>