<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc"><title id="title">并发审核为何不会默默覆盖</title><desc id="desc">示意时序；数据库实际等待受事务隔离与查询情况影响。。检查状态与写审计必须处于同一锁保护的事务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="510" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">并发审核为何不会默默覆盖</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">示意时序；数据库实际等待受事务隔离与查询情况影响。</text><text x="120" y="130" font-size="23" fill="#172b45" font-weight="650" text-anchor="middle">请求 A</text><line x1="120" y1="150" x2="120" y2="465" stroke="#bdcadd" stroke-dasharray="6 6"/><text x="480" y="130" font-size="23" fill="#172b45" font-weight="650" text-anchor="middle">同一反馈行</text><line x1="480" y1="150" x2="480" y2="465" stroke="#bdcadd" stroke-dasharray="6 6"/><text x="890" y="130" font-size="23" fill="#172b45" font-weight="650" text-anchor="middle">请求 B</text><line x1="890" y1="150" x2="890" y2="465" stroke="#bdcadd" stroke-dasharray="6 6"/><polyline points="120,182 480,182" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="145" y="171" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">SELECT FOR UPDATE · 获锁</text><polyline points="890,230 480,230" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="218" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">同一行：等待 A 释放锁</text><rect x="330" y="270" width="300" height="93" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="348" y="302" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">A 同一事务内</text><text x="348" y="334" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">更新状态 + 写审计</text><polyline points="480,390 120,390" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="153" y="378" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">COMMIT · 释放锁</text><polyline points="480,442 890,442" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="538" y="428" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">B 读到非 pending → 409</text></g></svg>