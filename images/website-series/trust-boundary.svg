<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 395" role="img" aria-labelledby="title desc"><title id="title">编译时的可信，不等于网络输入可信</title><desc id="desc">同一个对象，跨过网络后必须重新验证。。本报告实验只演示一个小型 guard，不能替代完整 API Schema。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="395" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">编译时的可信，不等于网络输入可信</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">同一个对象，跨过网络后必须重新验证。</text><rect x="30" y="135" width="250" height="125" rx="9" fill="#e4f5f1" stroke="#087f79" stroke-width="1.5"/><text x="48" y="167" font-size="23" fill="#087f79" font-weight="650" text-anchor="start">TypeScript 源码</text><text x="48" y="199" font-size="17.313915857605178" fill="#172b45" font-weight="400" text-anchor="start">Props / 返回值的静态约束</text><text x="48" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">类型在输出 JS 时擦除</text><rect x="425" y="135" width="250" height="125" rx="9" fill="#fff1dc" stroke="#a75c08" stroke-width="1.5"/><text x="443" y="167" font-size="23" fill="#a75c08" font-weight="650" text-anchor="start">JSON 边界</text><text x="443" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">外部输入仍可能是任意值</text><text x="443" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">as T 没有校验动作</text><rect x="820" y="135" width="250" height="125" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="838" y="167" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">运行时检查</text><text x="838" y="199" font-size="16.876971608832807" fill="#172b45" font-weight="400" text-anchor="start">客户端 guard / 服务端模型</text><text x="838" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">通过后才使用字段</text><polyline points="280,195 425,195" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="287" y="177" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">网络 / 反序列化</text><polyline points="675,195 820,195" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="694" y="177" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">验证或拒绝</text><text x="30" y="331" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">本站 apiRequest&lt;T> 使用类型断言；更强的响应 Schema 校验属于可改进项。</text></g></svg>