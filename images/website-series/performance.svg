<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">资源持续时间，不是请求瀑布</title><desc id="desc">历史单次慢网样本：3 Mbps / 150 ms / CPU 4×；各条从零对齐，仅比较 duration。。LCP 1052 ms，CLS 0.00418，一次长任务 165 ms。它们与资源下载持续时间不是同一个指标。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="520" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">资源持续时间，不是请求瀑布</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">历史单次慢网样本：3 Mbps / 150 ms / CPU 4×；各条从零对齐，仅比较 duration。</text><text x="30" y="161" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">主图 · 108350 B</text><rect x="290" y="140" width="437.01666666666665" height="29" rx="4" fill="#175fc5"/><text x="739.0166666666667" y="162" font-size="19" fill="#172b45" font-weight="400" text-anchor="start">806.8 ms</text><text x="30" y="218" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">JS A · 73426 B</text><rect x="290" y="197" width="571.35" height="29" rx="4" fill="#a75c08"/><text x="873.35" y="219" font-size="19" fill="#172b45" font-weight="400" text-anchor="start">1054.8 ms</text><text x="30" y="275" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">JS B · 77898 B</text><rect x="290" y="254" width="579.6374999999999" height="29" rx="4" fill="#a75c08"/><text x="881.6374999999999" y="276" font-size="19" fill="#172b45" font-weight="400" text-anchor="start">1070.1 ms</text><text x="30" y="332" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">CSS · 21854 B</text><rect x="290" y="311" width="186.76666666666665" height="29" rx="4" fill="#087f79"/><text x="488.76666666666665" y="333" font-size="19" fill="#172b45" font-weight