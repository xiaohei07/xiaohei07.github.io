<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">同步 API：线程等待，连接池也会等待</title><desc id="desc">一个 worker 进程内的概念结构；线程数不是数据库连接数。。连接池实验采用理想 FIFO 调度，不是实际 AnyIO 或数据库的容量测量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="480" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">同步 API：线程等待，连接池也会等待</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">一个 worker 进程内的概念结构；线程数不是数据库连接数。</text><rect x="30" y="135" width="260" height="125" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="48" y="167" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">ASGI 事件循环</text><text x="48" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">接收与调度请求</text><text x="48" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">阻塞调用会卡住事件循环</text><rect x="420" y="135" width="260" height="125" rx="9" fill="#fff1dc" stroke="#a75c08" stroke-width="1.5"/><text x="438" y="167" font-size="23" fill="#a75c08" font-weight="650" text-anchor="start">同步路由线程池</text><text x="438" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">def 路由在线程中执行</text><text x="438" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">等待 I/O 仍占用工作线程</text><rect x="810" y="135" width="260" height="125" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="828" y="167" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">数据库连接池</text><text x="828" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">本站 pool_size=3</text><text x="828" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">超额请求最多等 3 秒</text><polyline points="290,195 420,195" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="303" y="177" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">转交同步任务</text><polyline points="680,195 810,195" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="723" y="177" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">借连接</text><rect x="420" y="324" width="260" height="100" rx="9" fill="#ffecef" stroke="#ac3146" stroke-width="1.5"/><text x="438" y="356" font-size="23" fill="#ac3146" font-weight="650" text-anchor="start">CPU 密集任务</text><text x="438" y="388" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">GIL / 进程 / 外部任务系统</text><polyline points="550,260 550,324" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="455" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">worker 数增加时：连接池、进程内限流计数和内存也各自复制。</text></g></svg>