<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">一次成功回执，在 commit 之后返回</title><desc id="desc">用户输入、可信边界与持久事务分开检查。。演示没有发送真实请求；服务器事务状态与客户端提示不是同一份状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="500" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">一次成功回执，在 commit 之后返回</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">用户输入、可信边界与持久事务分开检查。</text><rect x="30" y="130" width="280" height="130" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="48" y="162" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">浏览器</text><text x="48" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">最小长度提示 / busy</text><text x="48" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">保留输入，等待回执</text><text x="48" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">15 秒超时不证明写入失败</text><rect x="410" y="130" width="280" height="130" rx="9" fill="#fff1dc" stroke="#a75c08" stroke-width="1.5"/><text x="428" y="162" font-size="23" fill="#a75c08" font-weight="650" text-anchor="start">Nginx + API</text><text x="428" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">体积 / Origin / 频率</text><text x="428" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">Pydantic 字段约束</text><text x="428" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">内容必须存在且已发布</text><path d="M790 138 C790 115 1070 115 1070 138 V252 C1070 275 790 275 790 252 Z" fill="#f1ebfb" stroke="#7052ae" stroke-width="2"/><ellipse cx="930" cy="138" rx="140" ry="17" fill="#f1ebfb" stroke="#7052ae"/><text x="808" y="173" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">数据库事务</text><text x="808" y="203" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">插入 pending 反馈</text><text x="808" y="228" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">约束校验 → commit</text><text x="808" y="253" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">成功后返回 201 + id</text><polyline points="310,194 410,194" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="690,194 790,194" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="930,270 930,330 170,330 170,260" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="335" y="318" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">回执丢失：可能已提交，客户端却不知道</text><rect x="410" y="380" width="280" height="85" rx="9" fill="#ffecef" stroke="#ac3146" stroke-width="1.5"/><text x="428" y="412" font-size="23" fill="#ac3146" font-weight="650" text-anchor="start">幂等键：尚未实现</text><text x="428" y="444" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">重复提交仍可能新增记录</text></g></svg>