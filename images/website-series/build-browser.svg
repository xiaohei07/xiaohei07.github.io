<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 425" role="img" aria-labelledby="title desc"><title id="title">同一页面的三个时刻</title><desc id="desc">本站采用静态导出；不是每次访问都运行 Next.js 服务。。SSG 是生成时机；hydration 是浏览器接管过程，两者可以同时存在。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="425" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">同一页面的三个时刻</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">本站采用静态导出；不是每次访问都运行 Next.js 服务。</text><rect x="30" y="130" width="310" height="170" rx="9" fill="#e4f5f1" stroke="#087f79" stroke-width="1.5"/><text x="48" y="162" font-size="23" fill="#087f79" font-weight="650" text-anchor="start">① 构建时</text><text x="48" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">读取公开内容</text><text x="48" y="219" font-size="16.387559808612444" fill="#172b45" font-weight="400" text-anchor="start">generateStaticParams 枚举路由</text><text x="48" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">输出正文 HTML 和客户端脚本</text><rect x="395" y="130" width="310" height="170" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="413" y="162" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">② 请求时</text><text x="413" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">Nginx 找到静态文件</text><text x="413" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">无需 Node 临时生成正文</text><text x="413" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">API 请求走另一条服务路径</text><rect x="760" y="130" width="310" height="170" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="778" y="162" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">③ 浏览器中</text><text x="778" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">先解析 HTML</text><text x="778" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">加载 JS，React 接管事件</text><text x="778" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">后续交互更新局部状态</text><polyline points="340,215 395,215" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="705,215 760,215" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="358" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">保存源文件 ≠ 修改线上 HTML；重新生成和发布之后，新的静态内容才可访问。</text></g></svg>