<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc"><title id="title">两条路径，不同的依赖</title><desc id="desc">实线：请求或构建产物流向；虚线：发布后供读取。TypeScript 不在网络调用链中。。阅读不依赖数据库；反馈需要 API 与数据库。箭头长度不表示耗时。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="510" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">两条路径，不同的依赖</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">实线：请求或构建产物流向；虚线：发布后供读取。TypeScript 不在网络调用链中。</text><text x="30" y="120" font-size="17" fill="#087f79" font-weight="650" text-anchor="start">构建阶段</text><rect x="30" y="142" width="250" height="106" rx="9" fill="#e4f5f1" stroke="#087f79" stroke-width="1.5"/><text x="48" y="174" font-size="23" fill="#087f79" font-weight="650" text-anchor="start">Markdown + 元数据</text><text x="48" y="206" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">文章、研究、项目清单</text><rect x="400" y="142" width="260" height="106" rx="9" fill="#e4f5f1" stroke="#087f79" stroke-width="1.5"/><text x="418" y="174" font-size="23" fill="#087f79" font-weight="650" text-anchor="start">Next.js / React</text><text x="418" y="206" font-size="17.8343949044586" fill="#172b45" font-weight="400" text-anchor="start">构建页面；TS 在构建前检查</text><rect x="790" y="142" width="280" height="106" rx="9" fill="#e4f5f1" stroke="#087f79" stroke-width="1.5"/><text x="808" y="174" font-size="23" fill="#087f79" font-weight="650" text-anchor="start">HTML / CSS / JS</text><text x="808" y="206" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">导出文件与响应式图片</text><polyline points="280,195 400,195" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="316" y="180" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">读取</text><polyline points="660,195 790,195" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="703" y="180" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">导出</text><text x="30" y="300" font-size="17" fill="#175fc5" font-weight="650" text-anchor="start">运行阶段</text><rect x="30" y="322" width="210" height="100" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="48" y="354" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">浏览器</text><text x="48" y="386" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">正文与 React 交互</text><rect x="300" y="322" width="200" height="100" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="318" y="354" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">Nginx</text><text x="318" y="386" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">文件 / API 分流</text><rect x="570" y="322" width="220" height="100" rx="9" fill="#fff1dc" stroke="#a75c08" stroke-width="1.5"/><text x="588" y="354" font-size="23" fill="#a75c08" font-weight="650" text-anchor="start">FastAPI</text><text x="588" y="386" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">校验、会话、事务</text><path d="M860 330 C860 307 1070 307 1070 330 V419 C1070 442 860 442 860 419 Z" fill="#f1ebfb" stroke="#7052ae" stroke-width="2"/><ellipse cx="965" cy="330" rx="105" ry="17" fill="#f1ebfb" stroke="#7052ae"/><text x="878" y="365" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">PostgreSQL</text><text x="878" y="395" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">持久数据</text><polyline points="240,370 300,370" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="500,370 570,370" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="513" y="353" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">/api/</text><polyline points="790,370 860,370" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="930,248 930,280 400,280 400,322" fill="none" stroke="#61738a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="563" y="272" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">静态读取不经数据库</text><text x="30" y="480" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">API 内部：Pydantic → SQLAlchemy → psycopg；网络协议由 psycopg 驱动承担。</text></g></svg>