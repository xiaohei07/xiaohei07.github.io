<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">持久状态由哪些表承接</title><desc id="desc">只列关键字段与关系，完整约束见 models.py；Alembic 版本表未画入业务模型。。箭头表达一对多关联方向，不表达查询执行顺序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="590" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">持久状态由哪些表承接</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">只列关键字段与关系，完整约束见 models.py；Alembic 版本表未画入业务模型。</text><rect x="30" y="135" width="290" height="130" rx="9" fill="#e4f5f1" stroke="#087f79" stroke-width="1.5"/><text x="48" y="167" font-size="23" fill="#087f79" font-weight="650" text-anchor="start">content_entries</text><text x="48" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">id · published</text><text x="48" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">内容登记，不存文章全文</text><rect x="410" y="135" width="300" height="170" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="428" y="167" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">feedback</text><text x="428" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">id · content_id → 内容</text><text x="428" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">kind · message · status</text><text x="428" y="249" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">reviewed_by → 作者</text><rect x="800" y="135" width="270" height="130" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="818" y="167" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">admin_users</text><text x="818" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">id · username</text><text x="818" y="224" font-size="15.70469798657719" fill="#172b45" font-weight="400" text-anchor="start">password_hash · is_active</text><rect x="410" y="390" width="300" height="130" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="428" y="422" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">audit_events</text><text x="428" y="454" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">actor_id → 作者</text><text x="428" y="479" font-size="16.336633663366342" fill="#172b45" font-weight="400" text-anchor="start">action · target_id · details</text><rect x="800" y="390" width="270" height="130" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="818" y="422" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">admin_sessions</text><text x="818" y="454" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">admin_id → 作者</text><text x="818" y="479" font-size="17.944785276073628" fill="#172b45" font-weight="400" text-anchor="start">token_hash · csrf_hash</text><text x="818" y="504" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">expires_at</text><polyline points="320,199 410,199" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="338" y="181" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">1 → N</text><polyline points="800,200 710,200" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="728" y="181" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">1 → N</text><polyline points="935,265 935,390" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="949" y="332" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">1 → N</text><polyline points="845,265 845,350 560,350 560,390" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="661" y="338" font-size="17" fill="#50627a" font-weight="400" text-anchor="start">1 → N</text><text x="30" y="563" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">审计 target_id 是业务目标标识；不要误画成直接外键或把 CSRF 原值画进数据库。</text></g></svg>