<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">一张图出现之前：先找瓶颈，再改资源</title><desc id="desc">示意阶段宽度不代表耗时；缓存、连接复用与资源竞争可能改变过程。。示意分解不是性能轨迹；不能将理想传输时间当成 LCP。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="430" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">一张图出现之前：先找瓶颈，再改资源</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">示意阶段宽度不代表耗时；缓存、连接复用与资源竞争可能改变过程。</text><rect x="30" y="130" width="230" height="140" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="48" y="162" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">发现与选择</text><text x="48" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">HTML / CSS 发现 URL</text><text x="48" y="219" font-size="15.470494417862838" fill="#172b45" font-weight="400" text-anchor="start">sizes × DPR 估算需要像素</text><text x="48" y="244" font-size="16.112956810631232" fill="#172b45" font-weight="400" text-anchor="start">srcset 候选由浏览器选择</text><rect x="300" y="130" width="230" height="140" rx="9" fill="#eaf1ff" stroke="#175fc5" stroke-width="1.5"/><text x="318" y="162" font-size="23" fill="#175fc5" font-weight="650" text-anchor="start">连接与等待</text><text x="318" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">DNS / TLS / 请求</text><text x="318" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">缓存命中可避免传输</text><text x="318" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">排队和 RTT 不能忽略</text><rect x="570" y="130" width="230" height="140" rx="9" fill="#fff1dc" stroke="#a75c08" stroke-width="1.5"/><text x="588" y="162" font-size="23" fill="#a75c08" font-weight="650" text-anchor="start">传输与解码</text><text x="588" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">字节经过网络</text><text x="588" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">压缩数据变成像素</text><text x="588" y="244" font-size="17.383512544802866" fill="#172b45" font-weight="400" text-anchor="start">decode 与 load 不等同</text><rect x="840" y="130" width="230" height="140" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="858" y="162" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">布局与呈现</text><text x="858" y="194" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">尺寸占位减少位移</text><text x="858" y="219" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">绘制 / 合成</text><text x="858" y="244" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">主线程忙仍会延后</text><polyline points="260,202 300,202" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="530,202 570,202" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,202 840,202" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="337" font-size="22" fill="#175fc5" font-weight="650" text-anchor="start">本次样本：108350 B ÷ 3 Mbps ≈ 0.289 s（仅理想传输）</text><text x="30" y="375" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">实际资源持续 806.8 ms，LCP 1052 ms；三者测量对象不同。</text></g></svg>