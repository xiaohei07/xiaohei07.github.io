<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 425" role="img" aria-labelledby="title desc"><title id="title">从 Python 对象到数据库协议</title><desc id="desc">ORM、驱动和数据库是三种不同职责。。当前连接池由 SQLAlchemy 管理，不额外叠加 psycopg_pool。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61738a"/></marker></defs><rect width="1100" height="425" rx="12" fill="#f8faff"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="30" y="45" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">从 Python 对象到数据库协议</text><text x="30" y="78" font-size="18" fill="#50627a" font-weight="400" text-anchor="start">ORM、驱动和数据库是三种不同职责。</text><rect x="30" y="135" width="230" height="135" rx="9" fill="#fff1dc" stroke="#a75c08" stroke-width="1.5"/><text x="48" y="167" font-size="23" fill="#a75c08" font-weight="650" text-anchor="start">业务对象</text><text x="48" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">Feedback / Session</text><text x="48" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">表达读取和修改意图</text><rect x="300" y="135" width="230" height="135" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="318" y="167" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">SQLAlchemy</text><text x="318" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">生成 SQL、绑定参数</text><text x="318" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">维护事务和连接池</text><rect x="570" y="135" width="230" height="135" rx="9" fill="#f1ebfb" stroke="#7052ae" stroke-width="1.5"/><text x="588" y="167" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">psycopg</text><text x="588" y="199" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">DBAPI 驱动 / 类型适配</text><text x="588" y="224" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">与 PostgreSQL 通信</text><path d="M840 143 C840 120 1070 120 1070 143 V262 C1070 285 840 285 840 262 Z" fill="#f1ebfb" stroke="#7052ae" stroke-width="2"/><ellipse cx="955" cy="143" rx="115" ry="17" fill="#f1ebfb" stroke="#7052ae"/><text x="858" y="178" font-size="23" fill="#7052ae" font-weight="650" text-anchor="start">PostgreSQL</text><text x="858" y="208" font-size="18" fill="#172b45" font-weight="400" text-anchor="start">解析并执行 SQL</text><text x="858" y="233" font-size="17.636363636363637" fill="#172b45" font-weight="400" text-anchor="start">锁、约束、提交、持久化</text><polyline points="260,200 300,200" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="530,200 570,200" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,200 840,200" fill="none" stroke="#61738a" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="345" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">参数绑定不等于把值拼进 SQL；连接失败与事务是否提交，要分开判断。</text></g></svg>